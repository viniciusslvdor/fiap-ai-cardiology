; Optional: build locally with PlatformIO and run in the Wokwi VS Code extension.
; On wokwi.com only sketch.ino, diagram.json and libraries.txt are needed.
[platformio]
src_dir = .

[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    beegee-tokyo/DHT sensor library for ESPx@^1.19
